<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MinimalResolution chart</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <svg id="chart" aria-label="Spectral sequence chart">
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
        <path d="M0,0 L10,5 L0,10 z"/>
      </marker>
    </defs>
    <g id="camera">
      <g id="grid"></g><g id="products"></g><g id="differentials"></g><g id="selection"></g><g id="bullets"></g>
    </g>
    <g id="fixedAxes"></g>
  </svg>

  <nav class="menubar">
    <label class="menu file-menu">Open<input id="fileInput" type="file" accept=".txt,text/plain"></label>
    <select id="productMode" class="menu" title="Multiplication lines"><option value="none">No products</option></select>
    <select id="lineMode" class="menu" title="Differentials"><option value="all">All lines</option><option value="current">Current lines</option><option value="none">No lines</option></select>
    <select id="page" class="menu" title="Page"></select>
    <button id="more" class="menu" title="Chart information">•••</button>
  </nav>

  <section id="info" class="info" aria-live="polite">
    <button id="closeInfo" aria-label="Close">×</button>
    <h2 id="infoName"></h2>
    <div id="infoBody"></div>
  </section>
  <div id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
